<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="badge">
      <rect x="0" y="0" width="100" height="100" rx="20"/>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="100" height="100" rx="20" fill="#d8531f"/>

  <g clip-path="url(#badge)" fill="#ffffff">
    <!-- 右の人物(左と同様に簡略化。胴体外側3点・腕外側1本・先端を円弧で丸め・胴体内側2点) -->
    <path d="M 105,100
             L 104.4,65
             L 101.8,57.9
             L 76.0,57.1
             L 53.3,34.6
             A 7,7 0 0 0 44.0,42.5
             L 70.0,70.0
             L 74,100
             Z"/>

    <!-- 左の人物(胴体外側3点・腕外側3点・腕内側3点・胴体内側2点に整理。手先のみ丸める) -->
    <path d="M -5,100
             L -4.9,62.3
             L -1.8,57.9
             L 23.9,57.1
             L 39.0,44.0
             A 7,7 0 0 1 46.1,54.4
             L 30.0,70.0
             L 26,100
             Z"/>

    <!-- 頭 -->
    <circle cx="13.7" cy="43.2" r="10.7"/>
    <circle cx="86.2" cy="43.2" r="10.7"/>
  </g>

  <!-- タッチの衝撃線(実測値ベース。左右は先端も根本も尖った紡錘形で斜めに流れ、
       中央だけ上が平らで下がとがった雫型) -->
  <g fill="#ffffff">
    <!-- 左の紡錘形 -->
    <path d="M 33.6,11.3
             L 31.0,13.4 L 29.7,14.4 L 30.6,15.4 L 31.8,16.5 L 32.9,17.5
             L 34.0,18.5 L 35.1,19.6 L 36.2,20.6 L 37.4,21.6 L 38.5,22.7
             L 39.6,23.7 L 40.8,24.7 L 41.9,25.9
             L 40.2,22.7 L 39.6,21.6 L 39.0,20.6 L 38.4,19.6 L 37.8,18.5
             L 37.2,17.5 L 36.6,16.5 L 36.0,15.4 L 35.4,14.4 L 34.8,13.4
             L 34.2,12.4 Z"/>
    <!-- 中央の雫型(上が平ら、下が点) -->
    <path d="M 45.3,8.8
             C 45.6,8.7 50.1,8.7 50.4,8.8
             L 49.5,15.7 L 48.6,21.5 L 47.85,25.4
             L 47.1,21.5 L 46.2,15.7 Z"/>
    <!-- 右の紡錘形(左の鏡像ではなく実測値) -->
    <path d="M 62.1,11.3
             L 61.5,12.4 L 60.9,13.4 L 60.3,14.4 L 59.7,15.4 L 59.1,16.5
             L 58.5,17.5 L 57.9,18.5 L 57.3,19.6 L 56.7,20.6 L 56.1,21.6
             L 55.5,22.7 L 54.9,23.7 L 54.3,24.7 L 53.8,25.8
             L 54.9,24.7 L 56.1,23.7 L 57.2,22.7 L 58.3,21.6 L 59.4,20.6
             L 60.6,19.6 L 61.7,18.5 L 62.8,17.5 L 63.9,16.5 L 65.1,15.4
             L 66.0,14.4 L 64.7,13.4 L 63.4,12.4 Z"/>
  </g>
</svg>
